<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たまこフライ</title>
<style>
  :root{
    --cream:#fdf4d8; --yellow:#f5c531; --orange:#f4a72c;
    --green:#79bd44; --green-d:#5fa233; --ink:#5a4632; --ink-l:#8a7355;
    --sky1:#bfe9f5; --sky2:#e8f7ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink); background:#d8eef7;
    display:flex; align-items:center; justify-content:center; min-height:100dvh; overflow:hidden;
  }
  #app{
    position:relative; width:100%; max-width:430px; height:100dvh; max-height:920px;
    overflow:hidden; touch-action:manipulation; cursor:pointer;
    box-shadow:0 0 40px rgba(0,0,0,.15);
  }
  canvas{display:block; width:100%; height:100%}

  .overlay{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    z-index:10;
  }
  .overlay.show{display:flex; animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .panel{
    background:rgba(255,255,255,.92); border-radius:24px; padding:24px 22px;
    box-shadow:0 14px 36px rgba(60,90,110,.3); width:100%; max-width:340px;
    backdrop-filter:blur(2px);
  }
  .logo-egg{font-size:12px; letter-spacing:.28em; color:var(--green-d); font-weight:800}
  .title{font-size:42px; font-weight:900; line-height:1; color:var(--ink);
    text-shadow:3px 3px 0 #fff, 5px 5px 0 var(--yellow); margin:4px 0 2px}
  .title .y{color:var(--orange)}
  .sub{font-size:13px; color:var(--ink-l); font-weight:700; margin-bottom:14px}
  .howto{font-size:15px; font-weight:800; line-height:1.7; margin-bottom:6px}
  .howto .tap{color:var(--orange)}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}

  .btn{border:none; cursor:pointer; font-family:inherit; font-weight:900;
    background:var(--green); color:#fff; font-size:18px; padding:14px 40px;
    border-radius:999px; box-shadow:0 5px 0 var(--green-d); transition:transform .08s,box-shadow .08s; margin-top:6px}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--green-d)}
  .btn.x{background:#111; color:#fff; box-shadow:0 5px 0 #000}
  .btn.sub{background:#fff; color:var(--green-d); box-shadow:0 5px 0 #e3d3a0}
  .btn-col{display:flex; flex-direction:column; gap:10px; align-items:center; width:100%; margin-top:14px}

  .go-emo{font-size:40px}
  .go-title{font-size:24px; font-weight:900; margin:2px 0 10px}
  .score-row{display:flex; justify-content:center; gap:26px; margin:8px 0 4px}
  .score-box .lab{font-size:11px; font-weight:800; color:var(--ink-l)}
  .score-box .num{font-size:34px; font-weight:900; line-height:1; color:var(--ink)}
  .score-box .num.hi{color:var(--orange)}
  .newbest{display:inline-block; font-size:12px; font-weight:900; color:#fff; background:var(--orange);
    padding:3px 12px; border-radius:999px; margin:6px 0; animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .brand{margin-top:14px; padding-top:12px; border-top:1px dashed #e1d2a8;
    font-size:11px; color:var(--ink-l); font-weight:800; line-height:1.6}
  .brand b{color:var(--green-d); letter-spacing:.06em}

  /* プレイ中スコア */
  #liveScore{
    position:absolute; top:24px; left:0; right:0; text-align:center; z-index:5;
    font-size:56px; font-weight:900; color:#fff; text-shadow:0 3px 0 rgba(90,70,50,.45);
    pointer-events:none; display:none;
  }
  #liveScore.show{display:block}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="liveScore">0</div>

  <!-- READY -->
  <div class="overlay show" id="ovReady">
    <div class="panel">
      <div class="logo-egg">🥚 ONE-TAP ARCADE</div>
      <div class="title">たま<span class="y">こ</span><br>フライ</div>
      <div class="sub">〜新卒、はばたく〜</div>
      <div class="howto"><span class="tap">タップ</span>で羽ばたく🪽<br>エンピツの間をすり抜けろ！</div>
      <button class="btn" id="startBtn">スタート</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay" id="ovOver">
    <div class="panel">
      <div class="go-emo" id="goEmo">🥚</div>
      <div class="go-title" id="goTitle">おつかれさま！</div>
      <div id="newBestWrap"></div>
      <div class="score-row">
        <div class="score-box"><div class="lab">SCORE</div><div class="num" id="goScore">0</div></div>
        <div class="score-box"><div class="lab">BEST</div><div class="num hi" id="goBest">0</div></div>
      </div>
      <div class="btn-col">
        <button class="btn x" id="shareBtn">𝕏 スコアをシェア</button>
        <button class="btn sub" id="retryBtn">もう一回とぶ</button>
      </div>
      <div class="brand">
        最初はみんな、よちよち。<br>
        <b>BLACKBOX</b> ― はじめての一歩は、ここから。
      </div>
    </div>
  </div>
</div>

<script>
const app=document.getElementById('app');
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const liveScore=document.getElementById('liveScore');
const ovReady=document.getElementById('ovReady');
const ovOver=document.getElementById('ovOver');

// ===== たまこ画像（背景込み一枚絵なのでキャラ部分だけ切り抜いて使う）=====
const img=new Image(); img.src='tamako.png'; let imgReady=false;
// 切り抜き範囲（自然サイズに対する割合：左下の「たま子」文字を外し中央キャラを狙う）
const CROP={x:0.16, y:0.05, w:0.70, h:0.74};
img.onload=()=>{ imgReady=true; };

// ===== サイズ =====
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, 2);
  W=app.clientWidth; H=app.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

// ===== 状態 =====
let state='ready'; // ready | play | over
let bird, pipes, score, best, speed, lastT, spawnX, shake;
best=parseInt(localStorage.getItem('tamako_fly_hi')||'0',10);

function reset(){
  bird={ x:W*0.30, y:H*0.42, vy:0, r:W*0.075, rot:0 };
  pipes=[]; score=0; speed=W*0.52; shake=0;
  spawnX=W+ W*0.2;
  spawnPipe();
  liveScore.textContent='0';
}

// 障害物（エンピツ）
function spawnPipe(){
  const gap=H*0.30;
  const margin=H*0.12;
  const gy = margin + Math.random()*(H - gap - margin*2 - H*0.10); // gap上端y
  pipes.push({ x:W+ W*0.16, gapY:gy, gap:gap, w:W*0.155, passed:false });
}

// ===== 入力 =====
function flap(){
  if(state==='play'){
    bird.vy = -H*0.62;
    blip(620,0.05);
  }
}
function onPress(e){
  if(state==='play'){ e.preventDefault(); flap(); }
}
app.addEventListener('pointerdown', onPress);
window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); if(state==='play') flap(); } });

document.getElementById('startBtn').onclick=(e)=>{ e.stopPropagation(); startGame(); };
document.getElementById('retryBtn').onclick=(e)=>{ e.stopPropagation(); startGame(); };
document.getElementById('shareBtn').onclick=(e)=>{ e.stopPropagation(); shareX(); };

function startGame(){
  reset();
  state='play';
  ovReady.classList.remove('show');
  ovOver.classList.remove('show');
  liveScore.classList.add('show');
  lastT=performance.now();
  flap();
}

function gameOver(){
  state='over';
  liveScore.classList.remove('show');
  shake=14;
  const isBest = score>best;
  if(isBest){ best=score; localStorage.setItem('tamako_fly_hi', String(best)); }
  document.getElementById('goScore').textContent=score;
  document.getElementById('goBest').textContent=best;
  document.getElementById('newBestWrap').innerHTML = isBest && score>0 ? '<div class="newbest">🎉 自己ベスト更新！</div>' : '';
  // スコアで表情/コメント
  let emo='🥚', t='よちよち新卒…';
  if(score>=30){emo='✨'; t='もう一人前！？';}
  else if(score>=15){emo='💼'; t='いい飛びっぷり！';}
  else if(score>=7){emo='🐣'; t='慣れてきた！';}
  else if(score>=3){emo='🐤'; t='その調子！';}
  document.getElementById('goEmo').textContent=emo;
  document.getElementById('goTitle').textContent=t;
  blip(180,0.12); setTimeout(()=>blip(120,0.14),90);
  setTimeout(()=>ovOver.classList.add('show'), 420);
}

// ===== ループ =====
function loop(t){
  requestAnimationFrame(loop);
  let dt=(t-(lastT||t))/1000; lastT=t;
  if(dt>0.05) dt=0.05;
  if(state==='play') update(dt);
  draw();
}
requestAnimationFrame(loop);

function update(dt){
  // 重力
  bird.vy += H*1.9*dt;
  bird.y += bird.vy*dt;
  bird.rot = Math.max(-0.5, Math.min(1.1, bird.vy/(H*0.9)));

  // スピード微増
  speed = (W*0.52) + Math.min(score,40)*(W*0.004);

  // 障害物移動
  for(const p of pipes){ p.x -= speed*dt; }
  // スポーン
  const last=pipes[pipes.length-1];
  if(last && last.x < W - W*0.62) spawnPipe();
  // 通過＆掃除
  for(const p of pipes){
    if(!p.passed && p.x + p.w < bird.x){ p.passed=true; score++; liveScore.textContent=score; blip(880,0.05); }
  }
  pipes=pipes.filter(p=>p.x + p.w > -W*0.2);

  // 当たり判定
  const hb = bird.r*0.62; // 判定甘め
  for(const p of pipes){
    if(bird.x+hb > p.x && bird.x-hb < p.x+p.w){
      if(bird.y-hb < p.gapY || bird.y+hb > p.gapY+p.gap){ return gameOver(); }
    }
  }
  // 天井・地面
  const ground=H-H*0.06;
  if(bird.y+hb > ground){ bird.y=ground-hb; return gameOver(); }
  if(bird.y-hb < 0){ bird.y=hb; bird.vy=0; }

  if(shake>0) shake*=0.9;
}

// ===== 描画 =====
let cloudOff=0;
function draw(){
  ctx.save();
  if(shake>0.5){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }

  // 空グラデ
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#bfe9f5'); g.addColorStop(0.6,'#e8f7ff'); g.addColorStop(1,'#fdf4d8');
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

  // 雲（パララックス）
  if(state==='play') cloudOff -= speed*0.18/60;
  drawClouds();

  // 障害物
  for(const p of pipes) drawPencilPair(p);

  // 地面
  ctx.fillStyle='#e7c977'; ctx.fillRect(-20,H-H*0.06,W+40,H*0.06+20);
  ctx.fillStyle='#d8b85c'; ctx.fillRect(-20,H-H*0.06,W+40,4);

  // たまこ
  drawBird();

  ctx.restore();
}

function drawClouds(){
  const cw=W*0.34, base=cloudOff% (W*0.6);
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(let i=-1;i<4;i++){
    const x=(i*W*0.6 + base + W*0.6)% (W*1.8) - W*0.3;
    const y=H*(0.12+ (i%2)*0.18 + 0.05*Math.sin(i*1.7));
    cloudBlob(x,y,cw*0.5);
  }
}
function cloudBlob(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r*0.6,0,7); ctx.arc(x+r*0.5,y-r*0.2,r*0.5,0,7);
  ctx.arc(x+r,y,r*0.55,0,7); ctx.arc(x+r*0.5,y+r*0.15,r*0.6,0,7);
  ctx.fill();
}

function drawPencilPair(p){
  const x=p.x, w=p.w, topH=p.gapY, botY=p.gapY+p.gap, botH=H-botY;
  // 上のエンピツ（消しゴム側＝天井、先＝下）
  drawPencil(x,0,w,topH,'down');
  // 下のエンピツ（先＝上、消しゴム＝地面）
  drawPencil(x,botY,w,botH,'up');
}
function drawPencil(x,y,w,h,dir){
  const tip=Math.min(h*0.5, w*0.9); // 先端の長さ
  const body=h-tip;
  ctx.save();
  // 影
  ctx.fillStyle='rgba(0,0,0,.06)';
  // 軸
  ctx.lineWidth=0;
  if(dir==='up'){
    // 先端は上向き（gap側）
    // 軸（黄色）
    pencilBody(x,y+tip,w,body);
    // 先端（木＋芯）上向き
    woodTip(x,y,w,tip,true);
  } else {
    // dir down: 先端は下向き（gap側）
    pencilBody(x,y,w,body);
    woodTip(x,y+body,w,tip,false);
  }
  ctx.restore();
}
function pencilBody(x,y,w,h){
  // 黄色軸＋稜線
  ctx.fillStyle='#f6c025'; roundRectP(x,y,w,h,4); ctx.fill();
  ctx.fillStyle='#ffd862'; ctx.fillRect(x+w*0.16,y,w*0.16,h); // ハイライト面
  ctx.fillStyle='#e0a31c'; ctx.fillRect(x+w*0.62,y,w*0.16,h); // 陰面
  ctx.strokeStyle='#5a4632'; ctx.lineWidth=2.2; roundRectP(x,y,w,h,4); ctx.stroke();
}
function woodTip(x,y,w,h,up){
  // 木の三角＋芯
  ctx.fillStyle='#e8b878'; ctx.strokeStyle='#5a4632'; ctx.lineWidth=2.2;
  ctx.beginPath();
  if(up){ ctx.moveTo(x,y+h); ctx.lineTo(x+w,y+h); ctx.lineTo(x+w/2,y); }
  else  { ctx.moveTo(x,y);   ctx.lineTo(x+w,y);   ctx.lineTo(x+w/2,y+h); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 芯（黒）
  ctx.fillStyle='#3a3330';
  const tipLen=h*0.32;
  ctx.beginPath();
  if(up){ ctx.moveTo(x+w*0.5-w*0.16,y+tipLen); ctx.lineTo(x+w*0.5+w*0.16,y+tipLen); ctx.lineTo(x+w/2,y); }
  else  { ctx.moveTo(x+w*0.5-w*0.16,y+h-tipLen); ctx.lineTo(x+w*0.5+w*0.16,y+h-tipLen); ctx.lineTo(x+w/2,y+h); }
  ctx.closePath(); ctx.fill();
}

function drawBird(){
  const b=bird, R=b.r;
  ctx.save();
  ctx.translate(b.x,b.y); ctx.rotate(b.rot);
  // しゃぼん玉カプセル
  ctx.beginPath(); ctx.arc(0,0,R,0,7);
  ctx.fillStyle='#ffffff'; ctx.fill();
  // 画像をクリップして中に
  if(imgReady){
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,R-3,0,7); ctx.clip();
    ctx.imageSmoothingEnabled=false;
    const nw=img.naturalWidth, nh=img.naturalHeight;
    const sx=nw*CROP.x, sy=nh*CROP.y, sw=nw*CROP.w, sh=nh*CROP.h;
    const d=(R-3)*2;
    ctx.drawImage(img, sx,sy,sw,sh, -R+3,-R+3, d,d);
    ctx.restore();
  }
  // カプセルの縁＆ハイライト
  ctx.lineWidth=3; ctx.strokeStyle='#7fc6e0';
  ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.ellipse(-R*0.4,-R*0.45,R*0.22,R*0.13,-0.6,0,7); ctx.fill();
  // 羽（速度で動く）
  const flapU = Math.max(0, -b.vy/(H*0.62));
  ctx.fillStyle='rgba(255,255,255,.92)'; ctx.strokeStyle='#7fc6e0'; ctx.lineWidth=2;
  const wy=-R*0.1 - flapU*R*0.3;
  ctx.beginPath(); ctx.ellipse(-R*1.0, wy, R*0.5,R*0.3, -0.5,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse( R*1.0, wy, R*0.5,R*0.3,  0.5,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function roundRectP(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ===== シェア =====
const SHARE_URL='https://yosuke-suzuki05.github.io/shacchi-games/tamako-fly.html';
function shareX(){
  let text=`【たまこフライ】スコア ${score}！🪽\n新卒たまこ、空をとぶ。\n\nあなたは何点とべる？\n#たまこフライ`;
  let url='https://twitter.com/intent/tweet?text='+encodeURIComponent(text);
  if(SHARE_URL) url+='&url='+encodeURIComponent(SHARE_URL);
  window.open(url,'_blank');
}

// ===== 効果音（軽いブリップ）=====
let actx;
function blip(freq,dur){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.value=0.04; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}
</script>
</body>
</html>
