<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>シャッチーくんの定時脱出</title>
<style>
  :root{ --ink:#2a2230; --pink:#ff7fa6; --gold:#ffcf3a; --green:#79bd44; --green-d:#5fa233; --red:#e23b3b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:#fff; background:#120c1e;
    display:flex; align-items:center; justify-content:center; min-height:100dvh; overflow:hidden;
  }
  #app{position:relative; width:100%; max-width:480px; height:100dvh; max-height:920px;
    overflow:hidden; display:flex; flex-direction:column; box-shadow:0 0 40px rgba(0,0,0,.4)}

  /* パズル選択バー */
  .topbar{flex:0 0 auto; display:none; align-items:center; justify-content:center; gap:14px; padding:16px 16px 8px}
  .topbar.show{display:flex}
  .navb{border:none; cursor:pointer; width:42px; height:42px; border-radius:50%; background:#2c2140;
    color:#fff; font-size:20px; font-weight:900; box-shadow:0 4px 0 #1b1430}
  .navb:active{transform:translateY(2px); box-shadow:0 2px 0 #1b1430}
  .navb:disabled{opacity:.35}
  .puz{ text-align:center; min-width:140px}
  .puz .lab{font-size:12px; font-weight:800; color:#cbbfda; letter-spacing:.15em}
  .puz .no{font-size:30px; font-weight:900; line-height:1.05}
  .puz .df{font-size:12px; font-weight:900}

  .boardwrap{flex:1 1 auto; position:relative; min-height:0}
  canvas{display:block; width:100%; height:100%; touch-action:none}

  .controls{flex:0 0 auto; display:none; padding:8px 18px 20px; gap:10px; align-items:center; justify-content:space-between}
  .controls.show{display:flex}
  .mv{font-size:15px; font-weight:900; color:#e9dff5}
  .mv b{color:var(--gold); font-size:20px}
  .mv small{color:#9a8cae; font-weight:800}
  .cbtns{display:flex; gap:10px}
  .mini{border:none; cursor:pointer; font-family:inherit; font-weight:900; font-size:15px; color:#fff;
    background:#3a2c54; border-radius:12px; padding:12px 18px; box-shadow:0 4px 0 #241a38; white-space:nowrap}
  .mini:active{transform:translateY(3px); box-shadow:0 1px 0 #241a38}

  .overlay{position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; z-index:10}
  .overlay.show{display:flex; animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel{background:rgba(24,14,32,.9); border:2px solid rgba(255,255,255,.12); border-radius:22px;
    padding:22px 20px; box-shadow:0 14px 40px rgba(0,0,0,.55); width:100%; max-width:360px; backdrop-filter:blur(3px)}
  .title-img{ width:100%; max-width:440px; image-rendering:pixelated; image-rendering:crisp-edges;
    border-radius:14px; box-shadow:0 14px 40px rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.1);
    animation:floaty 3s ease-in-out infinite }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .home-sub{font-size:14px; color:#e9dff5; font-weight:800; margin-top:14px; text-shadow:0 2px 0 rgba(0,0,0,.4)}
  .home-howto{font-size:12.5px; font-weight:700; line-height:1.8; color:#cbbfda; margin-top:12px}
  .home-howto b{color:var(--gold)}
  .go-emo{font-size:40px}
  .go-title{font-size:24px; font-weight:900; margin:2px 0 4px}
  .go-praise{font-size:13px; font-weight:800; color:var(--gold); margin-bottom:6px}
  .score-row{display:flex; justify-content:center; gap:26px; margin:8px 0}
  .sb .lab{font-size:11px; font-weight:800; color:#cbbfda}
  .sb .num{font-size:30px; font-weight:900; line-height:1}
  .sb .num.hi{color:var(--gold)}
  .newbest{display:inline-block; font-size:12px; font-weight:900; color:#2a2230; background:var(--gold);
    padding:3px 12px; border-radius:999px; margin:4px 0; animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .btn{border:none; cursor:pointer; font-family:inherit; font-weight:900; background:var(--green);
    color:#fff; font-size:18px; padding:14px 40px; border-radius:999px; box-shadow:0 5px 0 var(--green-d);
    transition:transform .08s,box-shadow .08s; margin-top:14px}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--green-d)}
  .btn.x{background:#111; color:#fff; box-shadow:0 5px 0 #000}
  .btn.sub{background:#fff; color:#33263f; box-shadow:0 5px 0 #b9a9cf}
  .btn-col{display:flex; flex-direction:column; gap:10px; align-items:center; width:100%; margin-top:14px}
  .brand{margin-top:14px; padding-top:10px; border-top:1px dashed rgba(255,255,255,.18);
    font-size:11px; color:#9a8cae; font-weight:800; letter-spacing:.06em}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <button class="navb" id="prevBtn">‹</button>
    <div class="puz">
      <div class="lab">パズル</div>
      <div class="no" id="puzNo">1</div>
      <div class="df" id="puzDiff">初級</div>
    </div>
    <button class="navb" id="nextNavBtn">›</button>
  </div>

  <div class="boardwrap"><canvas id="cv"></canvas></div>

  <div class="controls" id="controls">
    <div class="mv">手数 <b id="mvNum">0</b> <small id="mvBest"></small></div>
    <div class="cbtns">
      <button class="mini" id="undoBtn">↩ もどす</button>
      <button class="mini" id="resetBtn">⟲ リセット</button>
    </div>
  </div>

  <!-- READY -->
  <div class="overlay show" id="ovReady">
    <img class="title-img" src="sokoban-title.png" onerror="this.onerror=null;this.src='shacchi.png'" alt="シャッチーくんの定時脱出">
    <div class="home-sub">〜ブロックをずらして定時退社〜</div>
    <button class="btn" id="startBtn">出社する</button>
    <div class="home-howto">木のブロックを<b>ドラッグ</b>して動かし、<br><b>赤いシャッチー</b>を右の<b>退社ドア</b>から逃がせ！<br>ブロックは向きに沿って<b>スライド</b>するだけ（横は左右・縦は上下）<br>囲まれて動かせない時は<b>他をどかして道を空けよう</b></div>
  </div>

  <!-- CLEAR -->
  <div class="overlay" id="ovClear">
    <div class="panel">
      <div class="go-emo">🏃💨</div>
      <div class="go-title">定時退社！</div>
      <div class="go-praise" id="clearPraise"></div>
      <div id="clearBestWrap"></div>
      <div class="score-row">
        <div class="sb"><div class="lab">あなたの手数</div><div class="num" id="clearMv">0</div></div>
        <div class="sb"><div class="lab">最少手数</div><div class="num hi" id="clearOpt">0</div></div>
      </div>
      <div class="btn-col">
        <button class="btn" id="nextBtn">次のパズル ▶</button>
        <button class="btn sub" id="replayBtn">もう一度</button>
      </div>
      <div class="brand">社畜る ─ syachi9.black</div>
    </div>
  </div>

  <!-- ALL CLEAR -->
  <div class="overlay" id="ovEnd">
    <div class="panel">
      <div class="go-emo">🏆</div>
      <div class="go-title" id="endTitle">全パズル制覇！</div>
      <div class="go-praise">あなたはもう、定時退社の達人だ。</div>
      <div class="btn-col">
        <button class="btn x" id="shareBtn">𝕏 クリアをシェア</button>
        <button class="btn sub" id="restartBtn">最初のパズルへ</button>
      </div>
      <div class="brand">社畜る ─ syachi9.black</div>
    </div>
  </div>
</div>

<script>
const app=document.getElementById('app');
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d');
const boardwrap=document.querySelector('.boardwrap');
const topbar=document.getElementById('topbar'), controls=document.getElementById('controls');
const ovReady=document.getElementById('ovReady'), ovClear=document.getElementById('ovClear'), ovEnd=document.getElementById('ovEnd');
const now=()=>performance.now()/1000;
const N=6, EXIT_ROW=2;

// ===== レベル（BFSソルバーで全面の可解を検証済み）=====
// g: 6x6 文字グリッド（X=主役/赤, A..=障害ブロック, .=空） / m:最少手数 / d:難易度
const LEVELS=[
  {g:[".BEE..",".BCCC.","XX..D.","....D.","......","...AA."],m:2,d:"初級"},
  {g:[".....A","..BD.A","XXBD..","..B...","CCC...","......"],m:4,d:"初級"},
  {g:[".BBF.E",".DDF.E","XX.F.E",".AAA..",".CC...","......"],m:4,d:"初級"},
  {g:["..AABB",".EE...","XXFG..","..FG..","..CD..","..CDHH"],m:5,d:"中級"},
  {g:["EFFF..","E..GB.","XXCGBD","..CG.D",".....D",".AA..."],m:5,d:"中級"},
  {g:["..DD..","..HHH.","XX.E.G",".AAE.G","C..F.G","C..FBB"],m:7,d:"中級"},
  {g:["GGGAC.","...AC.","XXH.CE","F.HDDE","F.B...","F.B..."],m:8,d:"中級"},
  {g:["FFE.AA","..EGGG","XXE...",".HH..C","DDD..C",".BB..."],m:9,d:"上級"},
  {g:["..B...","..B...","XXBC..","...C.A",".EEE.A",".DD..A"],m:10,d:"上級"},
  {g:[".DD.GG","..BB..","XXF...","..FEEE","..F..C","..AAAC"],m:10,d:"上級"},
  {g:["...BE.","..GBE.","XXGBE.","C.G...","CDFF..",".D.AA."],m:16,d:"達人"},
  {g:["GGGF.B","AA.F.B","XXE..B","D.E...","DHHCC.","D....."],m:17,d:"達人"},
];
const TOTAL=LEVELS.length;
const DIFF_COLOR={'初級':'#79bd44','中級':'#5bb6e0','上級':'#ffb14c','達人':'#ff6b9d'};

// ===== 状態 =====
let W,H, cell, ox,oy, boardSize;
let blocks=[], moves=0, undoStack=[], levelIdx=0, state='ready';
let drag=null, exitAnim=null, shake=null;

function parseLevel(g){
  const cellsOf={};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const c=g[y][x]; if(c!=='.'){ (cellsOf[c]=cellsOf[c]||[]).push([x,y]); } }
  const bl=[];
  for(const ch in cellsOf){ const pts=cellsOf[ch];
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const o=(new Set(ys)).size===1?'h':'v';
    bl.push({id:ch, x:Math.min(...xs), y:Math.min(...ys), len:pts.length, o, main:ch==='X'});
  }
  return bl;
}
function loadLevel(i){
  levelIdx=(i+TOTAL)%TOTAL;
  blocks=parseLevel(LEVELS[levelIdx].g);
  moves=0; undoStack=[]; drag=null; exitAnim=null;
  layout(); updateHUD();
}
function updateHUD(){
  const L=LEVELS[levelIdx];
  document.getElementById('puzNo').textContent=levelIdx+1;
  const df=document.getElementById('puzDiff'); df.textContent=L.d; df.style.color=DIFF_COLOR[L.d];
  document.getElementById('mvNum').textContent=moves;
  const b=bestOf(levelIdx);
  document.getElementById('mvBest').textContent = b?('／ ベスト '+b):'';
  document.getElementById('prevBtn').disabled=(levelIdx===0);
  document.getElementById('nextNavBtn').disabled=(levelIdx===TOTAL-1);
}
const bestKey=i=>'ub_best_'+i;
const bestOf=i=>parseInt(localStorage.getItem(bestKey(i))||'0',10);

// ===== レイアウト（正方形盤面）=====
function resize(){
  const DPR=Math.min(window.devicePixelRatio||1,2);
  W=boardwrap.clientWidth; H=boardwrap.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);
function layout(){
  const margin=12;
  boardSize=Math.min(W-margin*2, H-margin*2);
  boardSize=Math.max(60, boardSize);
  cell=boardSize/N;
  ox=Math.round((W-boardSize)/2); oy=Math.round((H-boardSize)/2);
}

// ===== 盤面ユーティリティ =====
function occGrid(skip){
  const g=Array.from({length:N},()=>Array(N).fill(-1));
  blocks.forEach((b,i)=>{ if(i===skip)return;
    for(let k=0;k<b.len;k++){ const x=b.x+(b.o==='h'?k:0), y=b.y+(b.o==='v'?k:0); if(y<N&&x<N)g[y][x]=i; } });
  return g;
}
function reachRange(i){
  const b=blocks[i], g=occGrid(i);
  if(b.o==='h'){
    let lo=b.x; while(lo-1>=0 && g[b.y][lo-1]<0) lo--;
    let hi=b.x; while(hi+b.len<=N-1 && g[b.y][hi+b.len]<0) hi++;
    return [lo,hi];
  }else{
    let lo=b.y; while(lo-1>=0 && g[lo-1][b.x]<0) lo--;
    let hi=b.y; while(hi+b.len<=N-1 && g[hi+b.len][b.x]<0) hi++;
    return [lo,hi];
  }
}
function isSolved(){ const m=blocks.find(b=>b.main); return m.x===N-m.len; }

// ===== 入力（ドラッグ）=====
function ptCell(e){
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  return {px,py, cx:Math.floor((px-ox)/cell), cy:Math.floor((py-oy)/cell)};
}
cv.addEventListener('pointerdown', e=>{
  if(state!=='play'||exitAnim) return;
  const p=ptCell(e);
  if(p.cx<0||p.cy<0||p.cx>=N||p.cy>=N) return;
  const g=occGrid(-1); const i=g[p.cy][p.cx];
  if(i<0) return;
  const [lo,hi]=reachRange(i);
  const b=blocks[i];
  if(lo===hi){ shake={i,t:0}; blip(150,0.07); return; } // 周囲が塞がって今は動かせない
  drag={ i, axis:b.o, start:(b.o==='h'?b.x:b.y), lo, hi, anchorPx:(b.o==='h'?p.px:p.py), pos:(b.o==='h'?b.x:b.y) };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if(!drag) return; e.preventDefault();
  const r=cv.getBoundingClientRect();
  const cur=(drag.axis==='h'? e.clientX-r.left : e.clientY-r.top);
  let v=drag.start + (cur-drag.anchorPx)/cell;
  v=Math.max(drag.lo, Math.min(drag.hi, v));
  drag.pos=v;
});
function endDrag(){
  if(!drag) return;
  const b=blocks[drag.i];
  let snap=Math.round(drag.pos); snap=Math.max(drag.lo,Math.min(drag.hi,snap));
  const before=(b.o==='h'?b.x:b.y);
  if(snap!==before){
    undoStack.push(snapshot());
    if(b.o==='h') b.x=snap; else b.y=snap;
    moves++; blip(b.main?640:360,0.04); updateHUD();
    if(isSolved()) startExit();
  }
  drag=null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

function snapshot(){ return {blocks:blocks.map(b=>({...b})), moves}; }
function undo(){
  if(state!=='play'||exitAnim||!undoStack.length) return;
  const s=undoStack.pop(); blocks=s.blocks.map(b=>({...b})); moves=s.moves; drag=null; blip(240,0.04); updateHUD();
}
function resetLevel(){ if(state!=='play') return; loadLevel(levelIdx); blip(200,0.05); }

function startExit(){
  state='exit'; const m=blocks.find(b=>b.main);
  exitAnim={ t:0, fromX:m.x, blockRef:m };
  blip(900,0.08); setTimeout(()=>blip(1200,0.1),110); setTimeout(()=>blip(1500,0.12),230);
}

// ===== ナビ / ボタン =====
function gotoLevel(i){ if(state==='ready')return; loadLevel(i); state='play'; ovClear.classList.remove('show'); }
document.getElementById('prevBtn').onclick=()=>{ if(levelIdx>0) gotoLevel(levelIdx-1); };
document.getElementById('nextNavBtn').onclick=()=>{ if(levelIdx<TOTAL-1) gotoLevel(levelIdx+1); };
document.getElementById('undoBtn').onclick=undo;
document.getElementById('resetBtn').onclick=resetLevel;
window.addEventListener('keydown',e=>{ if(e.key==='z'||e.key==='Z')undo(); else if(e.key==='r'||e.key==='R')resetLevel(); });

document.getElementById('startBtn').onclick=()=>{ levelIdx=0; startLevel(); };
document.getElementById('nextBtn').onclick=()=>{ if(levelIdx>=TOTAL-1){ showEnd(); } else { levelIdx++; startLevel(); } };
document.getElementById('replayBtn').onclick=()=>{ startLevel(); };
document.getElementById('restartBtn').onclick=()=>{ levelIdx=0; startLevel(); };
document.getElementById('shareBtn').onclick=shareX;

function startLevel(){
  loadLevel(levelIdx); state='play';
  ovReady.classList.remove('show'); ovClear.classList.remove('show'); ovEnd.classList.remove('show');
  topbar.classList.add('show'); controls.classList.add('show');
}
function levelClear(){
  state='clear';
  const L=LEVELS[levelIdx], prev=bestOf(levelIdx), isBest=!prev||moves<prev;
  if(isBest) localStorage.setItem(bestKey(levelIdx),String(moves));
  document.getElementById('clearMv').textContent=moves;
  document.getElementById('clearOpt').textContent=L.m;
  let praise = moves<=L.m ? '🏆 最少手数クリア！完璧だ！' : (moves<=L.m+2?'😎 ほぼ最短！冴えてる':'片付けて、いざ退社！');
  document.getElementById('clearPraise').textContent=praise;
  document.getElementById('clearBestWrap').innerHTML = isBest?'<div class="newbest">🎉 自己ベスト更新！</div>':'';
  document.getElementById('nextBtn').textContent=(levelIdx>=TOTAL-1)?'結果を見る ▶':'次のパズル ▶';
  topbar.classList.remove('show'); controls.classList.remove('show'); ovClear.classList.add('show');
}
function showEnd(){ state='end'; ovClear.classList.remove('show'); ovEnd.classList.add('show'); }

// ===== ループ =====
let lastT=0;
function loop(t){ requestAnimationFrame(loop); let dt=(t-(lastT||t))/1000; lastT=t; if(dt>0.05)dt=0.05;
  if(exitAnim){ exitAnim.t+=dt; if(exitAnim.t>=0.6){ exitAnim=null; levelClear(); } }
  if(shake){ shake.t+=dt; if(shake.t>=0.4) shake=null; }
  draw();
}
requestAnimationFrame(loop);

// ===== 描画 =====
function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='ready'){ drawTray(); return; }
  drawTray();
  drawExit();
  drawRangeHint();
  for(let i=0;i<blocks.length;i++) drawBlock(i);
}
// 掴んだブロックの「動かせる範囲」をハイライト
function drawRangeHint(){
  if(!drag) return; const b=blocks[drag.i];
  let rx,ry,rw,rh;
  if(b.o==='h'){ rx=ox+drag.lo*cell; ry=oy+b.y*cell; rw=(drag.hi+b.len-drag.lo)*cell; rh=cell; }
  else { rx=ox+b.x*cell; ry=oy+drag.lo*cell; rw=cell; rh=(drag.hi+b.len-drag.lo)*cell; }
  const pad=cell*0.06;
  ctx.fillStyle='rgba(255,207,58,.16)';
  rr(rx+pad,ry+pad,rw-pad*2,rh-pad*2,cell*0.18); ctx.fill();
  ctx.strokeStyle='rgba(255,207,58,.5)'; ctx.lineWidth=Math.max(2,cell*0.04); ctx.setLineDash([cell*0.16,cell*0.12]);
  rr(rx+pad,ry+pad,rw-pad*2,rh-pad*2,cell*0.18); ctx.stroke(); ctx.setLineDash([]);
}
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawTray(){
  const pad=cell*0.18;
  // 外枠（濃い木）
  ctx.fillStyle='#5b3b1c'; rr(ox-pad,oy-pad,boardSize+pad*2,boardSize+pad*2,cell*0.25); ctx.fill();
  ctx.fillStyle='#7a4f26'; rr(ox-pad*0.5,oy-pad*0.5,boardSize+pad,boardSize+pad,cell*0.2); ctx.fill();
  // 盤面（薄い木）
  ctx.fillStyle='#9c6a34'; rr(ox,oy,boardSize,boardSize,cell*0.12); ctx.fill();
  // マス目グリッド
  ctx.strokeStyle='rgba(60,38,16,.35)'; ctx.lineWidth=Math.max(1,cell*0.03);
  for(let k=1;k<N;k++){
    ctx.beginPath(); ctx.moveTo(ox+k*cell,oy); ctx.lineTo(ox+k*cell,oy+boardSize); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,oy+k*cell); ctx.lineTo(ox+boardSize,oy+k*cell); ctx.stroke();
  }
  // 内側の影
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=Math.max(2,cell*0.06);
  rr(ox,oy,boardSize,boardSize,cell*0.12); ctx.stroke();
}
function drawExit(){
  // 右辺・EXIT_ROW に開口部＋ドア矢印
  const gy=oy+EXIT_ROW*cell, gx=ox+boardSize;
  ctx.fillStyle='#9c6a34'; ctx.fillRect(gx-2, gy+cell*0.06, cell*0.5, cell*0.88); // 枠を欠く
  ctx.save();
  ctx.fillStyle='rgba(121,189,68,.9)';
  ctx.font='900 '+Math.round(cell*0.30)+'px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('▶', gx+cell*0.08, gy+cell*0.5);
  ctx.font='900 '+Math.round(cell*0.20)+'px "Hiragino Maru Gothic ProN",sans-serif';
  ctx.fillText('退社', gx+cell*0.04, gy+cell*0.86);
  ctx.restore();
}
function drawBlock(i){
  const b=blocks[i];
  let bx=b.x, by=b.y;
  if(drag&&drag.i===i){ if(b.o==='h')bx=drag.pos; else by=drag.pos; }
  if(exitAnim&&b.main){ bx=exitAnim.fromX + (N+1-exitAnim.fromX)*ease(exitAnim.t/0.6); }
  let x=ox+bx*cell, y=oy+by*cell;
  if(shake&&shake.i===i){ const a=Math.sin(shake.t*64)*(1-shake.t/0.4)*cell*0.12;
    if(b.o==='h') x+=a; else y+=a; }
  const w=(b.o==='h'?b.len:1)*cell, h=(b.o==='v'?b.len:1)*cell;
  const m=cell*0.08, r=cell*0.22;
  // 影
  ctx.fillStyle='rgba(0,0,0,.28)'; rr(x+m+2,y+m+3,w-m*2,h-m*2,r); ctx.fill();
  // 本体
  const base = b.main ? '#d8392f' : '#c89048';
  const top  = b.main ? '#ef5a4d' : '#dCa45f';
  const dark = b.main ? '#a52820' : '#9c6a34';
  ctx.fillStyle=dark; rr(x+m,y+m,w-m*2,h-m*2,r); ctx.fill();
  ctx.fillStyle=base; rr(x+m,y+m,w-m*2,h-m*2-cell*0.06,r); ctx.fill();
  ctx.fillStyle=top;  rr(x+m,y+m,w-m*2,(h-m*2)*0.46,r); ctx.fill();
  // 木目
  ctx.strokeStyle='rgba(0,0,0,.10)'; ctx.lineWidth=Math.max(1,cell*0.025);
  if(b.o==='h'){ for(let k=1;k<b.len;k++){ const gx=x+k*cell; ctx.beginPath(); ctx.moveTo(gx,y+m*2); ctx.lineTo(gx,y+h-m*2); ctx.stroke(); } }
  else { for(let k=1;k<b.len;k++){ const gy=y+k*cell; ctx.beginPath(); ctx.moveTo(x+m*2,gy); ctx.lineTo(x+w-m*2,gy); ctx.stroke(); } }
  // フチ
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=Math.max(1,cell*0.03); rr(x+m,y+m,w-m*2,h-m*2,r); ctx.stroke();
  // 主役（シャッチー）の顔
  if(b.main){
    const fx=x+w-cell*0.5, fy=y+h*0.5;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(fx-cell*0.16,fy-cell*0.04,cell*0.11,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+cell*0.16,fy-cell*0.04,cell*0.11,0,7); ctx.fill();
    ctx.fillStyle='#2a2230';
    ctx.beginPath(); ctx.arc(fx-cell*0.13,fy-cell*0.02,cell*0.05,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+cell*0.19,fy-cell*0.02,cell*0.05,0,7); ctx.fill();
    // 必死の口
    ctx.strokeStyle='#2a2230'; ctx.lineWidth=Math.max(1,cell*0.04); ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(fx+cell*0.02,fy+cell*0.16,cell*0.10,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
  }
}
function ease(t){ t=Math.max(0,Math.min(1,t)); return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

let actx;
function blip(freq,dur){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=freq;
  g.gain.value=0.04; o.connect(g); g.connect(actx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur); o.stop(actx.currentTime+dur+0.02);}catch(e){} }
