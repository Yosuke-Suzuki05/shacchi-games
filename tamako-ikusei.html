<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>たまこ育成 〜新卒、ときどき卵〜</title>
<style>
  :root{
    --cream:#fdf4d8; --cream2:#fbe9b8;
    --yellow:#f5c531; --orange:#f4a72c;
    --green:#79bd44; --green-d:#5fa233;
    --ink:#5a4632; --ink-l:#8a7355;
    --white:#fff; --pink:#ff9fb0;
    --sky:#bfe3ef; --sky-d:#8fd0e0;
    --skill:#3aa6c9; --mental:#79bd44; --energy:#f4823a;
    --shadow:0 6px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(115deg, #fbe9b8 0 60px, #f6d98c 60px 120px);
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
  }
  #app{
    width:100%; max-width:430px; height:100dvh; max-height:920px;
    position:relative; overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, #fff6dd 0%, #fdf0c4 55%, #f7d98a 100%);
    box-shadow:0 0 0 4px rgba(255,255,255,.5) inset;
  }
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; padding:20px 18px; text-align:center;
  }
  .screen.active{display:flex; animation:fade .35s ease}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  /* ===== 画像 ===== */
  img.tama{image-rendering:pixelated; image-rendering:crisp-edges; user-select:none; -webkit-user-drag:none}

  /* ===== START ===== */
  #start{justify-content:center; gap:6px}
  .logo-egg{font-size:14px; letter-spacing:.3em; color:var(--green-d); font-weight:800}
  .title{
    font-size:40px; font-weight:900; line-height:1.05; color:var(--ink);
    text-shadow:3px 3px 0 #fff, 5px 5px 0 var(--yellow);
    margin:2px 0;
  }
  .title .y{color:var(--orange)}
  .subtitle{font-size:14px; color:var(--ink-l); margin-bottom:6px}
  .start-tama{width:180px; height:180px; animation:bob 2.2s ease-in-out infinite; margin:8px 0}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-12px) rotate(1deg)}}
  .lead{font-size:15px; line-height:1.7; color:var(--ink); font-weight:700; margin:4px 0 14px}
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:900;
    background:var(--green); color:#fff; font-size:19px;
    padding:15px 44px; border-radius:999px;
    box-shadow:0 5px 0 var(--green-d); transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--green-d)}
  .btn.sub{background:#fff; color:var(--green-d); box-shadow:0 5px 0 #e3d3a0}
  .btn.x{background:#111; color:#fff; box-shadow:0 5px 0 #000}
  .hint{font-size:11px; color:var(--ink-l); margin-top:14px}

  /* ===== GAME ===== */
  #game{justify-content:flex-start; padding-top:14px}
  .hud{width:100%; display:flex; flex-direction:column; gap:8px}
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:14px; padding:8px 12px; box-shadow:var(--shadow);
  }
  .rank{display:flex; align-items:center; gap:7px}
  .rank .emoji{font-size:20px}
  .rank .name{font-weight:900; font-size:15px}
  .lv{font-weight:900; color:var(--orange); font-size:13px; background:#fff3d6; padding:3px 9px; border-radius:999px}
  .bars{display:flex; flex-direction:column; gap:6px; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:var(--shadow)}
  .bar-row{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800}
  .bar-row .ic{width:18px; text-align:center}
  .bar-row .lab{width:46px; text-align:left; color:var(--ink-l)}
  .track{flex:1; height:12px; background:#eee4c6; border-radius:999px; overflow:hidden}
  .fill{height:100%; width:10%; border-radius:999px; transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .fill.skill{background:var(--skill)} .fill.mental{background:var(--mental)} .fill.energy{background:var(--energy)}
  .val{width:26px; text-align:right; color:var(--ink)}

  .exp-wrap{width:100%; margin-top:2px}
  .exp-label{display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--ink-l); margin-bottom:3px}
  .exp-track{height:10px; background:#eee4c6; border-radius:999px; overflow:hidden}
  .exp-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--yellow),var(--orange)); border-radius:999px; transition:width .4s}

  .stage{
    flex:1; width:100%; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:0;
  }
  .tama-game{
    width:160px; height:160px; cursor:pointer; position:relative; z-index:2;
    animation:bob 2.4s ease-in-out infinite;
  }
  .tama-game:active{animation:none; transform:scale(.94)}
  .mutter{
    position:absolute; top:18px; background:#fff; color:var(--ink);
    font-size:12px; font-weight:800; padding:7px 12px; border-radius:14px;
    box-shadow:var(--shadow); white-space:nowrap; opacity:0; pointer-events:none; z-index:3;
  }
  .mutter:after{content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#fff; border-bottom:0}
  .mutter.show{animation:pop 2.4s ease both}
  @keyframes pop{0%{opacity:0; transform:translateY(6px) scale(.9)} 12%,75%{opacity:1; transform:none} 100%{opacity:0; transform:translateY(-8px)}}

  .pluspop{position:absolute; font-weight:900; font-size:16px; color:var(--orange); pointer-events:none; z-index:5; text-shadow:0 1px 0 #fff}
  @keyframes rise{from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-46px)}}
  .spark{position:absolute; font-size:18px; pointer-events:none; z-index:4}
  @keyframes spk{from{opacity:1; transform:scale(.4)} to{opacity:0; transform:scale(1.4) translateY(-30px)}}

  /* イベントカード */
  .event{
    width:100%; background:#fff; border-radius:18px; padding:16px 16px 14px;
    box-shadow:0 10px 30px rgba(120,90,30,.22); border:3px solid #fff;
    position:relative; z-index:6;
  }
  .event .ev-ic{font-size:34px; line-height:1}
  .ev-tag{font-size:11px; font-weight:900; color:#fff; background:var(--orange); display:inline-block; padding:2px 10px; border-radius:999px; margin-bottom:6px}
  .ev-situation{font-size:14px; font-weight:800; line-height:1.55; margin:4px 0 6px}
  .ev-talk{font-size:13px; color:var(--ink-l); font-weight:700; background:#fff7e2; border-radius:10px; padding:8px 10px; margin-bottom:12px}
  .choices{display:flex; flex-direction:column; gap:8px}
  .choice{
    border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;
    background:#fff; color:var(--ink); text-align:left;
    padding:12px 14px; border-radius:12px; border:2px solid #f0e4c0;
    box-shadow:0 3px 0 #ece0bd; transition:transform .07s, box-shadow .07s, background .15s;
  }
  .choice:active{transform:translateY(3px); box-shadow:none; background:#fff7e2}

  .react{
    width:100%; background:#fff; border-radius:18px; padding:18px 16px;
    box-shadow:0 10px 30px rgba(120,90,30,.22); z-index:6; animation:fade .25s;
  }
  .react .r-talk{font-size:16px; font-weight:900; line-height:1.5}
  .react .r-delta{display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap; font-weight:900; font-size:13px}
  .react .r-delta span{padding:3px 10px; border-radius:999px; background:#fff3d6}
  .react .r-delta .up{color:var(--green-d)} .react .r-delta .down{color:#d9534f}

  .footer-brand{
    position:absolute; bottom:8px; left:0; right:0; text-align:center;
    font-size:10px; color:var(--ink-l); font-weight:800; letter-spacing:.05em; opacity:.8;
  }
  .footer-brand b{color:var(--green-d)}

  /* ===== RESULT ===== */
  #result{justify-content:center; gap:8px}
  .result-card{
    width:100%; background:#fff; border-radius:22px; padding:20px 18px 18px;
    box-shadow:0 14px 36px rgba(120,90,30,.28); position:relative; overflow:hidden;
  }
  .result-card:before{content:""; position:absolute; inset:0; background:
    repeating-linear-gradient(125deg, #fff 0 26px, #fffaf0 26px 52px); z-index:0}
  .rc-inner{position:relative; z-index:1}
  .rc-head{font-size:12px; font-weight:900; color:var(--orange); letter-spacing:.1em}
  .rc-tama{width:130px; height:130px; margin:4px 0}
  .rc-emoji{font-size:26px}
  .rc-name{font-size:26px; font-weight:900; line-height:1.1; margin:2px 0 2px}
  .rc-name .accent{color:var(--orange)}
  .rc-desc{font-size:13px; color:var(--ink-l); font-weight:700; line-height:1.6; margin:6px 4px 12px}
  .rc-stats{display:flex; justify-content:center; gap:14px; margin-bottom:8px}
  .rc-stat{font-size:11px; font-weight:800; color:var(--ink-l)}
  .rc-stat b{display:block; font-size:19px; color:var(--ink)}
  .rc-rate{font-size:12px; font-weight:900; color:var(--green-d); margin-bottom:6px}
  .rc-brand{border-top:1px dashed #e7d9b0; margin-top:10px; padding-top:10px; font-size:11px; color:var(--ink-l); font-weight:800; line-height:1.6}
  .rc-brand b{color:var(--green-d); font-size:13px; letter-spacing:.08em}
  .result-btns{display:flex; flex-direction:column; gap:10px; width:100%; margin-top:4px}
</style>
</head>
<body>
<div id="app">

  <!-- ========== START ========== -->
  <section id="start" class="screen active">
    <div class="logo-egg">🥚 SHINSOTSU IKUSEI GAME</div>
    <h1 class="title">たま<span class="y">子</span>育成</h1>
    <div class="subtitle">〜新卒、ときどき卵〜</div>
    <img class="tama start-tama" src="tamako.png" alt="たまこ">
    <p class="lead">右も左もわからない新卒「たまこ」。<br>あなたの育て方で、未来が決まる。</p>
    <button class="btn" onclick="startGame()">育てはじめる</button>
    <div class="hint">※ 放置でもOK。たまこをタップすると伸びるよ</div>
  </section>

  <!-- ========== GAME ========== -->
  <section id="game" class="screen">
    <div class="hud">
      <div class="titlebar">
        <div class="rank">
          <span class="emoji" id="rankEmoji">🥚</span>
          <span class="name" id="rankName">殻つき新卒</span>
        </div>
        <span class="lv" id="lvText">Lv.1</span>
      </div>
      <div class="bars">
        <div class="bar-row"><span class="ic">💼</span><span class="lab">スキル</span><span class="track"><span class="fill skill" id="barSkill"></span></span><span class="val" id="valSkill">10</span></div>
        <div class="bar-row"><span class="ic">🫧</span><span class="lab">メンタル</span><span class="track"><span class="fill mental" id="barMental"></span></span><span class="val" id="valMental">10</span></div>
        <div class="bar-row"><span class="ic">🔥</span><span class="lab">やる気</span><span class="track"><span class="fill energy" id="barEnergy"></span></span><span class="val" id="valEnergy">10</span></div>
      </div>
      <div class="exp-wrap">
        <div class="exp-label"><span>成長ゲージ</span><span id="expText">あと6日</span></div>
        <div class="exp-track"><span class="exp-fill" id="expFill"></span></div>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="mutter" id="mutter"></div>
      <img class="tama tama-game" id="tamaGame" src="tamako.png" alt="たまこ" onclick="pokeTama(event)">
    </div>

    <div class="footer-brand">powered by <b>BLACKBOX</b> ― はじめての一歩は、ここから。</div>
  </section>

  <!-- ========== RESULT ========== -->
  <section id="result" class="screen">
    <div class="result-card">
      <div class="rc-inner">
        <div class="rc-head">あなたのたまこは…</div>
        <img class="tama rc-tama" src="tamako.png" alt="たまこ">
        <div class="rc-emoji" id="rEmoji">✨</div>
        <div class="rc-name" id="rName">エースたまこ</div>
        <div class="rc-desc" id="rDesc"></div>
        <div class="rc-stats">
          <div class="rc-stat">スキル<b id="rSkill">0</b></div>
          <div class="rc-stat">メンタル<b id="rMental">0</b></div>
          <div class="rc-stat">やる気<b id="rEnergy">0</b></div>
        </div>
        <div class="rc-rate" id="rRate"></div>
        <div class="rc-brand">
          未経験のたまこも、向き合えばちゃんと一人前。<br>
          <b>BLACKBOX</b> ― はじめての一歩は、ここから。
        </div>
      </div>
    </div>
    <div class="result-btns">
      <button class="btn x" onclick="shareX()">𝕏 結果をシェアする</button>
      <button class="btn sub" onclick="restart()">もう一度育てる</button>
    </div>
  </section>

</div>

<script>
// ============ 状態 ============
const MAX_DAYS = 6;            // 1ランで進む「日数」＝イベント数
let stats, day, queue, busy;

const clamp = (v)=>Math.max(0,Math.min(100,Math.round(v)));

// 称号（成長段階）
const RANKS = [
  {emoji:'🥚', name:'殻つき新卒'},   // day0-1
  {emoji:'🐣', name:'おっかなびっくり新人'}, // day2
  {emoji:'🌱', name:'半人前'},        // day3
  {emoji:'💪', name:'そこそこ戦力'},  // day4
  {emoji:'💼', name:'一人前'},        // day5
  {emoji:'✨', name:'いっちょ前'},     // day6
];

// ============ あるあるイベント ============
// d: スキル/メンタル/やる気 の増減
const EVENTS = [
  {
    ic:'🖨️', tag:'コピー機との戦い',
    situation:'コピー機が「ガコンッ」と鳴ったまま動かない…！',
    talk:'たまこ「こ、これ…私のせい…ですよね…！？」',
    choices:[
      {label:'🛠️ 一緒に直してあげる', talk:'「先輩…後光が…！」', d:{skill:8, mental:5, energy:4}},
      {label:'👀 まず自分でやらせる', talk:'「やって…みます…！（涙目）」', d:{skill:10, mental:6, energy:-3}},
      {label:'📕 説明書を渡す', talk:'「説明書って…読むものだったんですね！？」', d:{skill:12, energy:-4}},
    ]
  },
  {
    ic:'📞', tag:'鳴り止まぬ電話',
    situation:'電話が鳴ってる。フロアの全員が、なぜか動かない。',
    talk:'たまこ「（出るしか…ないのでは…私が…）」',
    choices:[
      {label:'🫷 背中を押して出させる', talk:'「お、おでんわ、ありがとうございますっ！」', d:{skill:9, mental:8}},
      {label:'🙋 代わりに出てあげる', talk:'「次は…次こそは私が出ます…！」', d:{skill:-2, energy:6, mental:3}},
      {label:'😐 見守る（10コール目）', talk:'「…………ｺﾞｸﾘ」', d:{mental:10, skill:2}},
    ]
  },
  {
    ic:'📝', tag:'白紙の議事録',
    situation:'会議が終わった。たまこの議事録は、まっさら。',
    talk:'たまこ「議事録って…議事の、録…？」',
    choices:[
      {label:'🤖 AIの使い方を教える', talk:'「文明…！世界が光って見えます…！」', d:{skill:14, energy:5}},
      {label:'✍️ メモの取り方を伝授', talk:'「要点だけ…！つかめてきました…！」', d:{skill:10, energy:-2}},
      {label:'💪 今日中に粘らせる', talk:'「最後まで…やりきります…！」', d:{mental:9, energy:-5, skill:4}},
    ]
  },
  {
    ic:'😶', tag:'先輩の前でフリーズ',
    situation:'イケてる先輩に「これお願い」と渡され、たまこ、停止。',
    talk:'たまこ「…………（CPU使用率100%）」',
    choices:[
      {label:'🆘 助け舟を出す', talk:'「再起動…完了です！やります！」', d:{mental:7, energy:5}},
      {label:'🌬️ 「深呼吸」と声かけ', talk:'「すぅ…はぁ…いけます…！」', d:{mental:12, energy:2}},
      {label:'👀 そっと見守る', talk:'「だ、大丈夫です…たぶん…！」', d:{skill:7, mental:-4}},
    ]
  },
  {
    ic:'🦐', tag:'謎の専門用語',
    situation:'「それエビデンスある？」会議室がシーンとなった。',
    talk:'たまこ「エビ…デンス…海老の、何か…？」',
    choices:[
      {label:'📖 意味を教える', talk:'「賢くなった音が、しました」', d:{skill:13, energy:3}},
      {label:'🔍 自分でググらせる', talk:'「調べグセ…ついてきました…！」', d:{skill:9, energy:4}},
      {label:'😂 笑って場を和ます', talk:'「場が、和みました（？）」', d:{mental:8, energy:6}},
    ]
  },
  {
    ic:'📊', tag:'無限のエクセル',
    situation:'朝に頼まれた表。気づけば、もう夕方。',
    talk:'たまこ「セルが…無限に増えていきます…」',
    choices:[
      {label:'➗ 関数を教える', talk:'「SUM…君がいれば…！」', d:{skill:15, energy:4}},
      {label:'⌨️ ショートカットをそっと', talk:'「Ctrl＋…魔法ですか！？」', d:{skill:11, energy:6}},
      {label:'👏 頑張りを褒める', talk:'「もうひと粘り、できます！」', d:{energy:9, mental:5}},
    ]
  },
  {
    ic:'🪪', tag:'初めての名刺交換',
    situation:'相手は両手を差し出している。たまこの手は、震えている。',
    talk:'たまこ「申し遅れました…た、た、たまこ…と申しますっ」',
    choices:[
      {label:'🤝 横でフォローする', talk:'「無事…交換できました…！」', d:{skill:8, mental:6, energy:3}},
      {label:'🎤 事前に練習させる', talk:'「鏡の前で…100回やりました」', d:{skill:11, mental:5, energy:-3}},
      {label:'😊 笑顔だけ褒める', talk:'「笑顔は…自信あります！」', d:{mental:9, energy:5}},
    ]
  },
  {
    ic:'🍻', tag:'歓迎会のすみっこ',
    situation:'歓迎会。たまこは席の端で、枝豆と向き合っている。',
    talk:'たまこ「（この枝豆だけが…私の味方…）」',
    choices:[
      {label:'💬 話を振ってあげる', talk:'「私、しゃべれたっ…！」', d:{mental:8, energy:7}},
      {label:'🫛 そっとしておく', talk:'「枝豆、おいしいです」', d:{mental:6, skill:2}},
      {label:'🪑 隣に座る', talk:'「となり…ありがとうございます…！」', d:{mental:10, energy:4}},
    ]
  },
];

// 放置中のつぶやき
const MUTTERS = [
  'うぅ…がんばります…！','メモメモ…っと','これで合ってるかな…',
  'コーヒー、苦い…','ふぁ…ねむ……','せんぱい、すごい…','わたし、伸びてる…？',
  'たまご、たべたい','よし、いっちょやるか…！','ドキドキする…'
];

// ============ 進行 ============
function startGame(){
  stats = {skill:10, mental:10, energy:12};
  day = 0; busy=false;
  queue = shuffle([...EVENTS]).slice(0, MAX_DAYS);
  show('game');
  renderHUD();
  workPhase();
}

function workPhase(){
  if(day >= MAX_DAYS){ return finish(); }
  busy=false;
  clearStage();
  // 放置中：じわっとつぶやき＋やる気が少し減る（ながら感）
  ambientTimer = setTimeout(()=>{
    stats.energy = clamp(stats.energy - 2);
    renderBars();
    floatMutter(pick(MUTTERS));
  }, 700);
  // 次のイベントへ
  eventTimer = setTimeout(()=>{ showEvent(); }, 2600);
}

let ambientTimer, eventTimer;

function showEvent(){
  const ev = queue[day];
  clearStage();
  const card = document.createElement('div');
  card.className='event';
  card.innerHTML =
    `<div class="ev-ic">${ev.ic}</div>`+
    `<div class="ev-tag">${ev.tag}</div>`+
    `<div class="ev-situation">${ev.situation}</div>`+
    `<div class="ev-talk">${ev.talk}</div>`+
    `<div class="choices"></div>`;
  const cc = card.querySelector('.choices');
  ev.choices.forEach((c)=>{
    const b=document.createElement('button');
    b.className='choice'; b.textContent=c.label;
    b.onclick=()=>chooseAnswer(c);
    cc.appendChild(b);
  });
  stageEl().appendChild(card);
}

function chooseAnswer(c){
  if(busy) return; busy=true;
  // ステータス反映
  const d=c.d||{};
  for(const k of ['skill','mental','energy']){ if(d[k]) stats[k]=clamp(stats[k]+d[k]); }
  day++;
  renderHUD();
  // リアクション表示
  clearStage();
  const r=document.createElement('div'); r.className='react';
  const deltas=[];
  const labelMap={skill:'スキル',mental:'メンタル',energy:'やる気'};
  for(const k of ['skill','mental','energy']){
    if(d[k]){ const up=d[k]>0; deltas.push(`<span class="${up?'up':'down'}">${labelMap[k]} ${up?'+':''}${d[k]}</span>`); }
  }
  r.innerHTML=`<div class="r-talk">${c.talk}</div><div class="r-delta">${deltas.join('')}</div>`;
  stageEl().appendChild(r);
  bounceTama();
  // 次へ
  setTimeout(()=>{ workPhase(); }, 1700);
}

function finish(){
  clearStage();
  const ed = judge();
  document.getElementById('rEmoji').textContent = ed.emoji;
  document.getElementById('rName').innerHTML = ed.name;
  document.getElementById('rDesc').textContent = ed.desc;
  document.getElementById('rSkill').textContent = stats.skill;
  document.getElementById('rMental').textContent = stats.mental;
  document.getElementById('rEnergy').textContent = stats.energy;
  document.getElementById('rRate').textContent = `${ed.rate}％ がこの結末`;
  window._ed = ed;
  show('result');
}

// ============ ED判定 ============
function judge(){
  const {skill,mental,energy}=stats;
  const total=skill+mental+energy;
  const max=Math.max(skill,mental,energy);
  const min=Math.min(skill,mental,energy);
  // 全部低い → マイペース
  if(total < 90){
    return {emoji:'🐢', name:'マイペースたまこ', rate:9,
      desc:'急がず、焦らず、わが道を。これはこれで、立派な才能。'};
  }
  // バランス型
  if(max - min <= 10 && total >= 150){
    return {emoji:'🌟', name:'優等生たまこ', rate:16,
      desc:'スキルもメンタルもやる気も満点。気づけば後輩の見本に。'};
  }
  if(skill===max){
    return {emoji:'💼', name:'<span class="accent">エース</span>たまこ', rate:21,
      desc:'即戦力。「あの新人すごいらしい」と噂が立つころには、もう一人前。'};
  }
  if(mental===max){
    return {emoji:'🛡️', name:'<span class="accent">鋼メンタル</span>たまこ', rate:18,
      desc:'何があっても動じない。理不尽もエビデンスも、笑顔で受け流す。'};
  }
  // energy max
  return {emoji:'🔥', name:'<span class="accent">燃える</span>たまこ', rate:24,
    desc:'空回りもあるけど、誰よりも前のめり。その熱、巻き込む側の人間だ。'};
}

// ============ シェア ============
const SHARE_URL = ''; // ← 公開URLが決まったらここに入れる
function shareX(){
  const ed=window._ed||judge();
  const plain=ed.name.replace(/<[^>]+>/g,'');
  let text=`【たま子育成】私のたまこは「${plain}」に育ちました${ed.emoji}\n`+
    `スキル${stats.skill} / メンタル${stats.mental} / やる気${stats.energy}\n\n`+
    `あなたのたまこは、どう育つ？\n#たま子育成`;
  let url='https://twitter.com/intent/tweet?text='+encodeURIComponent(text);
  if(SHARE_URL) url+='&url='+encodeURIComponent(SHARE_URL);
  window.open(url,'_blank');
}
function restart(){ show('start'); }

// ============ 表示ヘルパ ============
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function stageEl(){ return document.getElementById('stage'); }
function clearStage(){
  clearTimeout(ambientTimer); clearTimeout(eventTimer);
  stageEl().querySelectorAll('.event,.react').forEach(e=>e.remove());
}
function renderHUD(){ renderBars(); renderRank(); renderExp(); }
function renderBars(){
  setBar('Skill', stats.skill); setBar('Mental', stats.mental); setBar('Energy', stats.energy);
}
function setBar(k,v){
  document.getElementById('bar'+k).style.width=v+'%';
  document.getElementById('val'+k).textContent=v;
}
function renderRank(){
  const r=RANKS[Math.min(day,RANKS.length-1)];
  document.getElementById('rankEmoji').textContent=r.emoji;
  document.getElementById('rankName').textContent=r.name;
  document.getElementById('lvText').textContent='Lv.'+(day+1);
}
function renderExp(){
  const pct=Math.round(day/MAX_DAYS*100);
  document.getElementById('expFill').style.width=pct+'%';
  const left=MAX_DAYS-day;
  document.getElementById('expText').textContent= left>0 ? `あと${left}日` : '退勤！';
}

// ============ インタラクション ============
function pokeTama(e){
  if(busy && stageEl().querySelector('.event')) return; // イベント中は無効
  stats.skill = clamp(stats.skill + 1);
  renderBars();
  bounceTama();
  const s=document.createElement('div'); s.className='pluspop';
  s.textContent= pick(['+1','+1','よしっ','ふんすっ','📈']);
  const rect=stageEl().getBoundingClientRect();
  s.style.left=(e.clientX-rect.left-8)+'px';
  s.style.top=(e.clientY-rect.top-10)+'px';
  s.style.animation='rise .8s ease forwards';
  stageEl().appendChild(s);
  setTimeout(()=>s.remove(),800);
  // たまにキラッ
  if(Math.random()<0.4){
    const k=document.createElement('div'); k.className='spark'; k.textContent='✨';
    k.style.left=(e.clientX-rect.left)+'px'; k.style.top=(e.clientY-rect.top)+'px';
    k.style.animation='spk .7s ease forwards';
    stageEl().appendChild(k); setTimeout(()=>k.remove(),700);
  }
}
function bounceTama(){
  const t=document.getElementById('tamaGame');
  t.style.animation='none'; void t.offsetWidth;
  t.style.transform='scale(1.12)';
  setTimeout(()=>{ t.style.transform=''; t.style.animation='bob 2.4s ease-in-out infinite'; },140);
}
function floatMutter(text){
  const m=document.getElementById('mutter');
  m.textContent=text; m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
}

// ============ util ============
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor((seedRand())*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let _seed = (typeof performance!=='undefined'? Math.floor(performance.now()*1000):12345)%2147483647 || 12345;
function seedRand(){ _seed=(_seed*16807)%2147483647; return (_seed-1)/2147483646; }
function pick(a){ return a[Math.floor(seedRand()*a.length)]; }
</script>
